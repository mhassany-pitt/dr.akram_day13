      pen $8
      mug $15
      Sale prices:
      pen $3
      mug $10
    console: |-
      Regular prices:
      pen $8
      mug $15
      Sale prices:
      pen $3
      mug $10
    status: pass
    feedback:
      on_pass:
        - "Your copy holds its own Product objects, so the sale didn't change the regular prices."
      on_fail:
        - "If the regular prices also dropped by $5, your copy shares objects with the original. Store a `new Product(...)` in each element of the copy."
        - "If you wrote `Product[] sale = products;`, both variables refer to the same array. You need a new array and new objects."
