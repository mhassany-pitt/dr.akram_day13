runtime:
  language: java
  version: 17
statement: |
  A store is running a sale: every product is $5 off. It needs a sale price list, but its regular prices must stay the same.

  Write `public static Product[] copyProducts(Product[] products)`. It returns a copy of `products` that doesn't share any `Product` objects with the original.

  In `main`, read the products, copy them, and take $5 off every price in the copy. Then print the regular prices and the sale prices as shown. The input starts with the number of products.

  **Example**

  Input:
  ```
  2
  pen 8
  mug 15
  ```
  Output:
  ```
  Regular prices:
  pen $8
  mug $15
  Sale prices:
  pen $3
  mug $10
  ```
hints:
  - "`System.out.println(p)` uses the `Product`'s `toString` method, so it prints text like `pen $8`."
  - "`copy[i] = products[i]` copies a reference, not an object. Both arrays would then point to the same `Product`, so changing one changes the other."
  - "Build the copy in two phases: create a new array of the same length, then store a `new Product(...)` with the same name and price in each element."
elements:
  - type: locked
    location:
      snippet: |-
        import java.util.Scanner;

        class Product {
            String name;
            int price;

            Product(String name, int price) {
                this.name = name;
                this.price = price;
            }

            public String toString() {
                return name + " $" + price;
            }
        }

        public class Main {
  - type: editable
    location:
      snippet: |2-
            public static Product[] copyProducts(Product[] products) {
                Product[] copy = new Product[products.length];
                for (int i = 0; i < products.length; i++) {
                    copy[i] = new Product(products[i].name, products[i].price);
                }
                return copy;
            }

            public static void main(String[] args) {
                Scanner in = new Scanner(System.in);
                int n = in.nextInt();
                Product[] products = new Product[n];
                for (int i = 0; i < n; i++) {
                    products[i] = new Product(in.next(), in.nextInt());
                }
                Product[] sale = copyProducts(products);
                for (int i = 0; i < sale.length; i++) {
                    sale[i].price -= 5;
                }
                System.out.println("Regular prices:");
                for (Product p : products) {
                    System.out.println(p);
                }
                System.out.println("Sale prices:");
                for (Product p : sale) {
                    System.out.println(p);
                }
            }
    placeholder: |2-
          // Write copyProducts and main here.
  - type: locked
    location:
      snippet: |-
        }
testcases:
