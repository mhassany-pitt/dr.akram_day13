$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: Main.java
license: MIT
locale: en-US
id: park_a_car_free_coding
title: Park a Car
description: Use null to represent empty spots in an array of Car objects, and fill the first empty spot.
authors:
  - first: Bita
    last: Akram
    email: bita.akram@gmail.com
    affiliation: NC State University
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
    - arrays
    - classes
    - for-loops
    - string-equals
  topics:
    - arrays-of-objects
    - null
    - null-pointer-exception
    - searching-arrays
runtime:
  language: java
  version: 17
statement: |
  A parking lot is stored as a `Car[]` array. An empty spot is `null`.

  Write `public static int park(Car[] lot, Car car)`. It puts `car` in the first empty spot and returns that spot's index. If the lot is full, it returns `-1`.

  In `main`, read the lot and the new car's plate, then park the car. Print `Parked in spot` and the index, or `Lot is full`. Then print every spot, using `empty` for empty spots. The input starts with the number of spots.

  **Example**

  Input:
  ```
  4
  ABC123
  empty
  XYZ789
  empty
  JKL456
  ```
  Output:
  ```
  Parked in spot 1
  ABC123
  JKL456
  XYZ789
  empty
  ```
hints:
  - "When reading the lot, store a `new Car(plate)` only when the word isn't `empty`. Compare with `.equals`, not `==`."
  - "In `park`, return as soon as you fill a spot. Otherwise the same car will fill every empty spot."
  - "Return `-1` only after the loop has checked every spot."
  - "`Car` has no `toString`, so print `lot[i].plate`. Check `lot[i] == null` first, or you'll get a `NullPointerException`."
elements:
  - type: locked
    location:
      snippet: |-
        import java.util.Scanner;

        class Car {
            String plate;

            Car(String plate) {
                this.plate = plate;
            }
        }

        public class Main {
  - type: editable
    location:
      snippet: |2-
            public static int park(Car[] lot, Car car) {
                for (int i = 0; i < lot.length; i++) {
                    if (lot[i] == null) {
                        lot[i] = car;
                        return i;
                    }
                }
                return -1;
            }

            public static void main(String[] args) {
                Scanner in = new Scanner(System.in);
                int n = in.nextInt();
                Car[] lot = new Car[n];
                for (int i = 0; i < n; i++) {
                    String plate = in.next();
                    if (!plate.equals("empty")) {
                        lot[i] = new Car(plate);
                    }
                }
                Car newCar = new Car(in.next());
                int spot = park(lot, newCar);
                if (spot == -1) {
                    System.out.println("Lot is full");
                } else {
                    System.out.println("Parked in spot " + spot);
                }
                for (int i = 0; i < lot.length; i++) {
                    if (lot[i] == null) {
                        System.out.println("empty");
                    } else {
                        System.out.println(lot[i].plate);
                    }
                }
            }
    placeholder: |2-
          // Write park and main here.
  - type: locked
    location:
      snippet: |-
        }
testcases:
  - title: Empty Spot in the Middle
    visible: true
    stdin:
      - "4"
      - "ABC123"
      - "empty"
      - "XYZ789"
      - "empty"
      - "JKL456"
    stdout: |-
      Parked in spot 1
      ABC123
      JKL456
      XYZ789
      empty
    console: |-
      Parked in spot 1
      ABC123
      JKL456
      XYZ789
      empty
    status: pass
    feedback:
      on_pass:
        - "You found the first null spot, filled it, and left the later empty spot alone."
      on_fail:
        - "If `JKL456` appears twice, your loop kept going after parking. Return as soon as you fill a spot."
        - "If you got a NullPointerException, you used `lot[i].plate` on an empty spot. Check `lot[i] == null` first."
  - title: Full Lot
    visible: true
    stdin:
      - "3"
      - "ABC123"
      - "XYZ789"
      - "QRS111"
      - "JKL456"
    stdout: |-
      Lot is full
      ABC123
      XYZ789
      QRS111
    console: |-
      Lot is full
      ABC123
      XYZ789
      QRS111
    status: pass
    feedback:
      on_pass:
        - "Your method returned -1 when no spot was null, and the lot stayed unchanged."
      on_fail:
        - "When no spot is null, `park` should return `-1` after the loop, and `main` should print `Lot is full`."
  - title: Only the Last Spot Is Empty (hidden)
    visible: false
    stdin:
      - "3"
      - "ABC123"
      - "XYZ789"
      - "empty"
      - "JKL456"
    stdout: |-
      Parked in spot 2
      ABC123
      XYZ789
      JKL456
    console: |-
      Parked in spot 2
      ABC123
      XYZ789
      JKL456
    status: pass
    feedback:
      on_pass:
        - "Your loop checks every spot, including the last one."
      on_fail:
        - "Check your loop bounds. The loop must reach index `lot.length - 1`."
        - "Don't return `-1` inside the loop. A taken spot doesn't mean the lot is full."
  - title: Every Spot Is Empty (hidden)
    visible: false
    stdin:
      - "3"
      - "empty"
      - "empty"
      - "empty"
      - "JKL456"
    stdout: |-
      Parked in spot 0
      JKL456
      empty
      empty
    console: |-
      Parked in spot 0
      JKL456
      empty
      empty
    status: pass
    feedback:
      on_pass:
        - "You parked in spot 0 and left the other empty spots null."
      on_fail:
        - "When every spot is empty, the car goes in spot 0, and the other spots stay empty."
